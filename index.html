  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f5f7f2; color: #244f3b; }
    body { margin: 0; }
    #roomvibe-loading { position: fixed; inset: 0; z-index: 99999; display: grid; place-items: center; overflow: auto; background: radial-gradient(ellipse at 50% 40%, #fbfcf8, #f5f7f2 65%); transition: opacity .22s ease; }
    #roomvibe-loading.leaving { opacity: 0; pointer-events: none; }
    .loading-content { padding: 24px; text-align: center; max-width: 440px; box-sizing: border-box; width: 100%; }
    .apartment { display: block; width: min(100%, 360px); margin: 0 auto; aspect-ratio: 380/320; }
    .piece { transform-box: fill-box; transform-origin: center; animation: assemble 4.2s cubic-bezier(.2,.7,.2,1) infinite both; filter: drop-shadow(0 3px 4px #365b4120); }
    .piece:nth-of-type(2) { animation-delay: .23s; }
    .piece:nth-of-type(3) { animation-delay: .46s; }
    .piece:nth-of-type(4) { animation-delay: .69s; }
    .piece:nth-of-type(5) { animation-delay: .92s; }
    .piece:nth-of-type(6) { animation-delay: 1.15s; }
    @keyframes assemble {
      0% { opacity: 0; transform: translate(var(--x), var(--y)) rotate(var(--r)); }
      40%, 85% { opacity: 1; transform: translate(0,0) rotate(0); }
      100% { opacity: 0; transform: translate(0,0); }
    }
    h1 { margin: 0; font-size: 36px; line-height: 1.2; font-weight: 700; letter-spacing: -1.5px; }
    .tagline { margin: 10px 0 16px; color: #3d5948; font-size: 18px; }
    .build-signature { margin: 8px 0 0; font-size: 12px; color: #596e60; }
    #loading-status, #loading-hint { color: #748076; font-size: 13px; line-height: 1.5; margin: 0; }
    #loading-hint { margin-top: 12px; }
    #loading-retry { margin-top: 20px; padding: 12px 24px; border: 0; border-radius: 24px; background: #296448; color: white; font: inherit; cursor: pointer; }
    #loading-retry:focus-visible { outline: 3px solid #91b3a0; outline-offset: 4px; }
    .failed .piece { animation: none; opacity: 1; }
    @media (max-height: 460px) { .apartment { width: 200px; } h1 { font-size: 28px; } .tagline { margin-bottom: 10px; } }
    @media (prefers-reduced-motion: reduce) { .piece { animation: none; opacity: 1; } #roomvibe-loading { transition: none; } }
  </style>
</head>
